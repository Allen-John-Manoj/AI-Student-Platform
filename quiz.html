<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFinder - Career Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 200, 255, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #a8b4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 24px;
            resize: vertical;
            transition: all 0.3s ease;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        textarea:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .button-loading {
            color: transparent;
        }

        .button-loading::after {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .question {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 32px;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        #question-text, #skill-question {
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.95);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .option-button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.9);
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 500;
            text-align: left;
            transition: all 0.25s ease;
        }

        .option-button:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(102, 126, 234, 0.4);
            transform: translateY(-1px);
            box-shadow: none;
        }

        .option-button.selected {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.6);
            color: #fff;
        }

        .option-button:disabled {
            opacity: 1;
            cursor: pointer;
        }

        .career-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            margin: 16px 0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .career-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.3);
        }

        .career-card.selected {
            background: rgba(102, 126, 234, 0.15);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .career-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .career-card p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .career-card .skills-tag {
            display: inline-block;
            background: rgba(102, 126, 234, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-right: 6px;
            margin-top: 6px;
            color: rgba(255, 255, 255, 0.8);
        }

        #progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 32px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .button-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .score {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin: 32px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #feedback {
            margin-top: 16px;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        #feedback p {
            margin: 0;
        }

        .section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        #assessment-area {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 24px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 28px;
                border-radius: 20px;
            }

            h2 {
                font-size: 1.6rem;
            }

            .question {
                padding: 24px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>

        <section id="intro" class="section active">
            <div class="logo">
                <div class="logo-icon">&#9733;</div>
            </div>
            <h2>Discover Your Path</h2>
            <p class="subtitle">Take a personalized career assessment powered by AI to uncover career paths aligned with your interests, skills, and aspirations.</p>
            <textarea id="user-description" placeholder="Tell us about yourself... Include your background, interests, passions, and what you're looking for in a career."></textarea>
            <button onclick="startAssessment()">Begin Assessment</button>
        </section>

        <section id="assessment" class="section">
            <h3 id="assessment-area"></h3>
            <div class="question">
                <p id="question-text"></p>
                <div id="options" class="options"></div>
            </div>
            <button onclick="nextQuestion()" id="next-button">Continue</button>
        </section>

        <section id="recommendations" class="section">
            <h2>Your Career Matches</h2>
            <p class="subtitle">Based on your responses, here are career paths that align with your profile. Select one to test your skills.</p>
            <div id="careers-container"></div>
            <div class="button-group">
                <button onclick="showSkillsTest()">Test Your Skills</button>
                <button onclick="restartAssessment()" class="button-secondary">Start Over</button>
            </div>
        </section>

        <section id="skills-test" class="section">
            <h2 id="skills-title"></h2>
            <div class="question">
                <p id="skill-question"></p>
                <div id="skill-options" class="options"></div>
                <div id="feedback"></div>
            </div>
            <div id="score" class="score"></div>
            <div id="final-buttons" class="button-group" style="display: none;">
                <button onclick="retrySkillTest()">Try Again</button>
                <button onclick="showSection('recommendations')" class="button-secondary">Back to Results</button>
            </div>
            <button onclick="nextSkillQuestion()" id="next-skill-button" style="display: none;">Next Question</button>
        </section>
    </div>

    <script>
        let currentSection = 'intro';
        let currentQuestion = 0;
        let currentArea = '';
        let assessmentData = null;
        let userResponses = {};
        let userDescription = '';
        let recommendations = null;
        let skillQuestions = null;
        let currentSkillQuestion = 0;
        let skillScore = 0;

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
            currentSection = sectionId;
        }

        function showButtonLoading(button) {
            button.disabled = true;
            button.classList.add('button-loading');
        }

        function hideButtonLoading(button) {
            button.disabled = false;
            button.classList.remove('button-loading');
        }

        function updateProgress(step, total) {
            const percentage = (step / total) * 100;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
        }

        async function startAssessment() {
            const submitButton = document.querySelector('#intro button');
            userDescription = document.getElementById('user-description').value;
            if (!userDescription.trim()) {
                alert('Please tell us about yourself to get started.');
                return;
            }

            showButtonLoading(submitButton);
            try {
                const response = await fetch('/generate-questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userDescription })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                assessmentData = await response.json();
                currentArea = Object.keys(assessmentData.areas)[0];
                showSection('assessment');
                displayQuestion();
            } catch (error) {
                console.error('Error:', error);
                alert('Error generating questions. Please try again.');
            } finally {
                hideButtonLoading(submitButton);
            }
        }

        function displayQuestion() {
            const areaQuestions = assessmentData.areas[currentArea].questions;
            if (currentQuestion >= areaQuestions.length) {
                currentArea = Object.keys(assessmentData.areas)[Object.keys(assessmentData.areas).indexOf(currentArea) + 1];
                currentQuestion = 0;
                
                if (!currentArea) {
                    showRecommendations();
                    return;
                }
            }

            const question = areaQuestions[currentQuestion];
            document.getElementById('assessment-area').textContent = currentArea.replace(/_/g, ' ');
            document.getElementById('question-text').textContent = question.question;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            Object.entries(question.options).forEach(([key, value]) => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = `${key}. ${value}`;
                button.onclick = () => selectOption(key);
                optionsContainer.appendChild(button);
            });

            const totalQuestions = Object.keys(assessmentData.areas).reduce((total, area) => 
                total + assessmentData.areas[area].questions.length, 0);
            
            const questionsCompleted = Object.keys(assessmentData.areas).slice(0, Object.keys(assessmentData.areas).indexOf(currentArea))
                .reduce((total, area) => total + assessmentData.areas[area].questions.length, 0) + currentQuestion + 1;
            
            updateProgress(questionsCompleted, totalQuestions);
        }

        function selectOption(option) {
            document.querySelectorAll('#options .option-button').forEach(button => {
                button.classList.remove('selected');
                if (button.textContent.startsWith(option)) {
                    button.classList.add('selected');
                }
            });
        }

        function nextQuestion() {
            const selected = document.querySelector('#options .option-button.selected');
            if (!selected) {
                alert('Please select an option');
                return;
            }

            if (!userResponses[currentArea]) {
                userResponses[currentArea] = [];
            }
            userResponses[currentArea].push(selected.textContent[0]);

            currentQuestion++;
            displayQuestion();
        }

        function calculateTraitScores() {
            const traitScores = {};
            Object.keys(userResponses).forEach(area => {
                userResponses[area].forEach((response, idx) => {
                    const question = assessmentData.areas[area].questions[idx];
                    if (question && question.category) {
                        const traitIndex = response.charCodeAt(0) - 65;
                        const trait = question.category[traitIndex];
                        if (trait) {
                            traitScores[trait] = (traitScores[trait] || 0) + 1;
                        }
                    }
                });
            });
            return traitScores;
        }

        async function showRecommendations() {
            const button = document.querySelector('#next-button');
            showButtonLoading(button);
            try {
                const response = await fetch('/generate-recommendations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        traitScores: calculateTraitScores(),
                        responses: userResponses,
                        userDescription
                    })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                recommendations = await response.json();
                
                const container = document.getElementById('careers-container');
                container.innerHTML = '';
                
                recommendations.career_paths.forEach((career, index) => {
                    const card = document.createElement('div');
                    card.className = 'career-card';
                    card.dataset.index = index;
                    
                    const skillsHtml = career.required_skills.map(skill => 
                        `<span class="skills-tag">${skill}</span>`
                    ).join('');
                    
                    card.innerHTML = `
                        <input type="radio" name="career" value="${index}" id="career${index}" style="display: none;">
                        <h3>${career.title}</h3>
                        <p>${career.description}</p>
                        <div>${skillsHtml}</div>
                    `;
                    
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.career-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        card.querySelector('input[type="radio"]').checked = true;
                    });
                    
                    container.appendChild(card);
                });

                showSection('recommendations');
                updateProgress(100, 100);
            } catch (error) {
                console.error('Error:', error);
                alert('Error generating recommendations. Please try again.');
            } finally {
                hideButtonLoading(button);
            }
        }

        async function showSkillsTest() {
            const selectedCard = document.querySelector('.career-card.selected');
            if (!selectedCard) {
                alert('Please select a career path first');
                return;
            }

            const careerIndex = selectedCard.dataset.index;
            const careerTitle = recommendations.career_paths[careerIndex].title;

            const button = document.querySelector('#recommendations .button-group button');
            showButtonLoading(button);

            try {
                const response = await fetch('/skill-test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ careerTitle })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                skillQuestions = await response.json();
                currentSkillQuestion = 0;
                skillScore = 0;
                showSection('skills-test');
                displaySkillQuestion();
                
                document.getElementById('final-buttons').style.display = 'none';
                document.getElementById('score').textContent = '';
                document.querySelector('#skills-test .question').style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('Error generating skill test. Please try again.');
            } finally {
                hideButtonLoading(button);
            }
        }

        function displaySkillQuestion() {
            const question = skillQuestions.questions[currentSkillQuestion];
            document.getElementById('skills-title').textContent = `Question ${currentSkillQuestion + 1} of ${skillQuestions.questions.length}`;
            document.getElementById('skill-question').textContent = question.question;
            
            const optionsContainer = document.getElementById('skill-options');
            optionsContainer.innerHTML = '';
            
            Object.entries(question.options).forEach(([key, value]) => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = `${key}. ${value}`;
                button.onclick = () => selectSkillOption(key, question.correct_answer, question.explanation);
                optionsContainer.appendChild(button);
            });

            document.getElementById('feedback').innerHTML = '';
            document.getElementById('next-skill-button').style.display = 'none';
            updateProgress(currentSkillQuestion + 1, skillQuestions.questions.length);
        }

        function selectSkillOption(selected, correct, explanation) {
            const buttons = document.querySelectorAll('#skill-options .option-button');
            buttons.forEach(button => {
                button.disabled = true;
                if (button.textContent.startsWith(selected)) {
                    button.classList.add('selected');
                }
                if (button.textContent.startsWith(correct)) {
                    button.style.background = 'rgba(34, 197, 94, 0.3)';
                    button.style.borderColor = 'rgba(34, 197, 94, 0.6)';
                }
            });

            const feedbackEl = document.getElementById('feedback');
            if (selected === correct) {
                skillScore++;
                feedbackEl.style.background = 'rgba(34, 197, 94, 0.15)';
                feedbackEl.innerHTML = `<p style="color: #4ade80;">Correct! ${explanation}</p>`;
            } else {
                feedbackEl.style.background = 'rgba(239, 68, 68, 0.15)';
                feedbackEl.innerHTML = `<p style="color: #f87171;">Incorrect. ${explanation}</p>`;
            }

            document.getElementById('next-skill-button').style.display = 'block';
        }

        function nextSkillQuestion() {
            currentSkillQuestion++;
            if (currentSkillQuestion >= skillQuestions.questions.length) {
                document.querySelector('#skills-test .question').style.display = 'none';
                document.getElementById('next-skill-button').style.display = 'none';
                document.getElementById('score').textContent = `Score: ${skillScore}/${skillQuestions.questions.length}`;
                document.getElementById('final-buttons').style.display = 'flex';
                return;
            }
            displaySkillQuestion();
        }

        function retrySkillTest() {
            const selectedCard = document.querySelector('.career-card.selected');
            if (selectedCard) {
                showSkillsTest();
            }
        }

        function restartAssessment() {
            currentSection = 'intro';
            currentQuestion = 0;
            currentArea = '';
            assessmentData = null;
            userResponses = {};
            recommendations = null;
            skillQuestions = null;
            currentSkillQuestion = 0;
            skillScore = 0;
            document.getElementById('user-description').value = '';
            updateProgress(0, 100);
            showSection('intro');
        }
    </script>
</body>
</html>

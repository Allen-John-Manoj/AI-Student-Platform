<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Lora', serif;
            color: #4a3628;
            border: 1px solid rgba(74, 54, 40, 0);
            font-size: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
        }

        h2 {
            font-family: 'Lora', serif;
            color: #2c1810;
            font-size: 2.7rem;
            margin-bottom: 30px;
            text-align: center;
        }

        p {
            font-size: 1.15rem;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid rgba(74, 54, 40, 0);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.774);
            font-family: 'Lora', serif;
            font-size: 1rem;
            color: #000000;
            margin-bottom: 20px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            background: #8b5e3c;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            gap: 50px;
        }

        button:hover {
            background: #6b4423;
        }

        button:disabled {
            background: #a89385;
            cursor: not-allowed;
            color: #ffffff00;
        }

        .button-loading {
            position: relative;
            color: transparent;
        }

        .button-loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: button-loading-spinner 1s linear infinite;
            z-index: 1;
        }

        @keyframes button-loading-spinner {
            from { transform: translate(-50%, -50%) rotate(0turn); }
            to { transform: translate(-50%, -50%) rotate(1turn); }
        }

        .question {
            background: rgba(255, 255, 255, 0.8);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            font-size: 2.5rem;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .option-button {
            background: rgba(139, 94, 60, 0.281);
            border: 1px solid #8b5e3c;
            backdrop-filter: blur(10px);
            color: #000000;
            padding: 12px 30px;
            border-radius: 8px;
            font-family: 'Lora', serif;
            font-size: 1rem;
            font-weight: 400rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            width: 100%;
            gap: 15px;
        }

        .option-button:hover {
            background: rgba(161, 112, 47, 0.274);
        }

        .option-button.selected {
            background: #ffffff;
            border-color: #ffffff;
        }

        /* Update the disabled state to not affect visibility */
        .option-button:disabled {
            cursor: pointer;
            opacity: 1;
            background: rgba(161, 112, 47, 0.274);
            color: #000000;
        }

        .career-card {
            padding: 25px;
            margin: 15px 0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(139, 94, 60, 0.281);
            border: 1px solid #8b5e3c;
            backdrop-filter: blur(10px);
        }

        .career-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .career-card.selected {
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(139, 94, 60, 0.2);
        }

        .career-card h3 {
            color: #2c1810;
            font-family: 'Lora', serif;
            margin: 0 0 15px 0;
        }

        #progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(139, 94, 60, 0.1);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: #8b5e3c;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: center;
        }

        .button-secondary {
            background: rgba(139, 94, 60, 0.2);
            color: #4a3628;
        }

        .button-secondary:hover {
            background: rgba(139, 94, 60, 0.3);
        }

        .score {
            font-family: 'Lora', serif;
            font-size: 1.5rem;
            color: #2c1810;
            text-align: center;
            margin: 30px 0;
        }

        #feedback {
            border-radius: 8px;
            font-style: italic;
        }

        .section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                width: 95%;
            }

            h2 {
                font-size: 2rem;
            }

            .career-card {
                padding: 15px;
            }
            
            .option-button {
                min-height: 70px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
  <div class="container">
      <div id="progress-bar">
          <div id="progress-fill"></div>
      </div>

      <!-- Introduction Section -->
      <section id="intro" class="section active">
          <h2>Welcome to Career Assessment</h2>
          <p>To personalize your assessment, please tell us about yourself:</p>
          <p>Include your background, interests, and what you're looking for in a career</p>
          <textarea id="user-description" placeholder="Tell us about yourself..."></textarea>
          <button onclick="startAssessment()">Start Assessment</button>
      </section>

      <!-- Assessment Questions Section -->
      <section id="assessment" class="section">
          <h2 id="assessment-area"></h2>
          <div id="question-container" class="question">
              <p id="question-text"></p>
              <div id="options" class="options"></div>
          </div>
          <button onclick="nextQuestion()" id="next-button">Next Question</button>
      </section>

      <!-- Recommendations Section -->
      <section id="recommendations" class="section">
          <h2>Your Career Recommendations</h2>
          <p>Select a career path and click 'Test Your Skills' to proceed:</p>
          <div id="careers-container"></div>
          <div class="button-group">
              <button onclick="showSkillsTest()">Test Your Skills</button>
              <button onclick="restartAssessment()" class="button-secondary">Start Over</button>
          </div>
      </section>

      <section id="skills-test" class="section">
        <h2 id="skills-title"></h2>
        <div class="question">
            <p id="skill-question"></p>
            <div id="skill-options" class="options"></div>
        <div id="feedback"></div>
        <div id="score" class="score"></div></div>
        <div id="final-buttons" class="button-group">
            <button onclick="retrySkillTest()">Try Again</button>
            <button onclick="showSection('recommendations')" class="button-secondary">Back to Careers</button>
        </div>
        <button onclick="nextSkillQuestion()" id="next-skill-button">Next Question</button>
    </section>
</div>

  <script>
    let currentSection = 'intro';
    let currentQuestion = 0;
    let currentArea = '';
    let assessmentData = null;
    let userResponses = {};
    let recommendations = null;
    let skillQuestions = null;
    let currentSkillQuestion = 0;
    let skillScore = 0;

    // Show/hide sections function
    function showSection(sectionId) {
        document.querySelectorAll('.section').forEach(section => {
            section.classList.remove('active');
        });
        document.getElementById(sectionId).classList.add('active');
        currentSection = sectionId;
    }

    function showButtonLoading(button) {
        button.disabled = true;
        button.classList.add('button-loading');
        button.style.paddingRight = '40px';
    }

    function hideButtonLoading(button) {
        button.disabled = false;
        button.classList.remove('button-loading');
        button.style.paddingRight = '30px';
    }

        function updateProgress(step, total) {
            const percentage = (step / total) * 100;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
        }

        async function startAssessment() {
            const submitButton = document.querySelector('#intro button');
            userDescription = document.getElementById('user-description').value;
            if (!userDescription.trim()) {
                alert('Please provide a description about yourself.');
                return;
            }

            showButtonLoading(submitButton);
            try {
                const response = await fetch('http://localhost:5000/generate-questions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ userDescription })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                assessmentData = await response.json();
                currentArea = Object.keys(assessmentData.areas)[0];
                showSection('assessment');
                displayQuestion();
            } catch (error) {
                console.error('Error:', error);
                alert('Error generating questions. Please try again.');
            } finally {
                hideButtonLoading(submitButton);
            }
        }

        function displayQuestion() {
            const areaQuestions = assessmentData.areas[currentArea].questions;
            if (currentQuestion >= areaQuestions.length) {
                currentArea = Object.keys(assessmentData.areas)[Object.keys(assessmentData.areas).indexOf(currentArea) + 1];
                currentQuestion = 0;
                
                if (!currentArea) {
                    showRecommendations();
                    return;
                }
            }

            const question = areaQuestions[currentQuestion];
            document.getElementById('assessment-area').textContent = currentArea.toUpperCase();
            document.getElementById('question-text').textContent = question.question;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            Object.entries(question.options).forEach(([key, value]) => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = `${key}. ${value}`;
                button.onclick = () => selectOption(key);
                optionsContainer.appendChild(button);
            });

            const totalQuestions = Object.keys(assessmentData.areas).reduce((total, area) => 
                total + assessmentData.areas[area].questions.length, 0);
            
            const questionsCompleted = Object.keys(assessmentData.areas).slice(0, Object.keys(assessmentData.areas).indexOf(currentArea))
                .reduce((total, area) => total + assessmentData.areas[area].questions.length, 0) + currentQuestion + 1;
            
            updateProgress(questionsCompleted, totalQuestions);
        }

        function selectOption(option) {
            document.querySelectorAll('.option-button').forEach(button => {
                button.classList.remove('selected');
                if (button.textContent.startsWith(option)) {
                    button.classList.add('selected');
                }
            });
        }

        function nextQuestion() {
            const selected = document.querySelector('.option-button.selected');
            if (!selected) {
                alert('Please select an option');
                return;
            }

            if (!userResponses[currentArea]) {
                userResponses[currentArea] = [];
            }
            userResponses[currentArea].push(selected.textContent[0]);

            currentQuestion++;
            displayQuestion();
        }

        async function showRecommendations() {
            const button = document.querySelector('#next-button');
            showButtonLoading(button);
            try {
                const response = await fetch('http://localhost:5000/generate-recommendations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        traitScores: calculateTraitScores(),
                        responses: userResponses,
                        userDescription
                    })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                recommendations = await response.json();
                
                const container = document.getElementById('careers-container');
                container.innerHTML = '';
                
                recommendations.career_paths.forEach((career, index) => {
                    const card = document.createElement('div');
                    card.className = 'career-card';
                    card.dataset.index = index;
                    card.innerHTML = `
                        <input type="radio" name="career" value="${index}" id="career${index}" style="display: none;">
                        <h3>${index + 1}. ${career.title}</h3>
                        <p style="font-weight: 400;">${career.description}</p>
                        <p style="font-weight: 400;"><strong>Required Skills:</strong> ${career.required_skills.join(', ')}</p>
                    `;
                    
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.career-card').forEach(c => 
                            c.classList.remove('selected'));
                        card.classList.add('selected');
                        const radio = card.querySelector('input[type="radio"]');
                        radio.checked = true;
                    });
                    
                    container.appendChild(card);
                });

                showSection('recommendations');
                updateProgress(100, 100);
            } catch (error) {
                console.error('Error:', error);
                alert('Error generating recommendations. Please try again.');
            } finally {
                hideButtonLoading(button);
            }
        }

        async function showSkillsTest() {
    const selectedCard = document.querySelector('.career-card.selected');
    if (!selectedCard) {
        alert('Please select a career path to test your skills');
        return;
    }

    const careerIndex = selectedCard.dataset.index;
    const careerTitle = recommendations.career_paths[careerIndex].title;

    // Get the button that was clicked
    const button = document.querySelector('.button-group button');
    showButtonLoading(button);

    try {
        const response = await fetch('http://localhost:5000/skill-test', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ careerTitle })
        });

        if (!response.ok) {
            throw new Error('Network response was not ok');
        }

        skillQuestions = await response.json();
        currentSkillQuestion = 0;
        skillScore = 0;
        showSection('skills-test');
        displaySkillQuestion();
        
        document.getElementById('final-buttons').style.display = 'none';
        document.getElementById('next-skill-button').style.display = 'flex';
        document.getElementById('skill-question').style.display = 'flex';
        document.getElementById('skill-options').style.display = 'flex';
        document.getElementById('feedback').style.display = 'flex';
        document.getElementById('score').textContent = '';
    } catch (error) {
        console.error('Error:', error);
        alert('Error generating skill test. Please try again.');
    } finally {
        hideButtonLoading(button);
    }
}

function displaySkillQuestion() {
    const question = skillQuestions.questions[currentSkillQuestion];
    document.getElementById('skills-title').textContent = `Skills Test Question ${currentSkillQuestion + 1}/${skillQuestions.questions.length}`;
    document.getElementById('skill-question').textContent = question.question;
    
    const optionsContainer = document.getElementById('skill-options');
    optionsContainer.innerHTML = '';
    
    Object.entries(question.options).forEach(([key, value]) => {
        const buttonWrapper = document.createElement('div'); // Create wrapper div
        const button = document.createElement('button');
        button.className = 'option-button';
        button.textContent = `${key}. ${value}`;
        button.onclick = () => selectSkillOption(key, question.correct_answer, question.explanation);
        buttonWrapper.appendChild(button);
        optionsContainer.appendChild(buttonWrapper);
    });

    document.getElementById('feedback').innerHTML = '';
    document.getElementById('next-skill-button').style.display = 'none';
    updateProgress(currentSkillQuestion + 1, skillQuestions.questions.length);
}

        function selectSkillOption(selected, correct, explanation) {
            const buttons = document.querySelectorAll('.option-button');
            buttons.forEach(button => {
                button.disabled = true;
                if (button.textContent.startsWith(selected)) {
                    button.classList.add('selected');
                    button.disabled = false;
                }
                if (button.textContent.startsWith(correct)) {
                    button.style.backgroundColor = '#06402B';
                    button.style.color = 'white';
                    button.style.borderColor = '#06402B';
                }
            });

            if (selected === correct) {
                skillScore++;
                document.getElementById('feedback').innerHTML = `<p style="color: #06402B">${explanation}</p>`;
            } else {
                document.getElementById('feedback').innerHTML = `<p style="color: #AF2413">${explanation}</p>`;
            }

            document.getElementById('next-skill-button').style.display = 'block';
        }

        function nextSkillQuestion() {
            currentSkillQuestion++;
            if (currentSkillQuestion >= skillQuestions.questions.length) {
                document.getElementById('skill-question').style.display = 'none';
                document.getElementById('skill-options').style.display = 'none';
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('next-skill-button').style.display = 'none';
                document.getElementById('score').textContent = `Final Score: ${skillScore}/${skillQuestions.questions.length}`;
                document.getElementById('final-buttons').style.display = 'flex';
                return;
            }
            displaySkillQuestion();
        }

        function retrySkillTest() {
            // Get the currently selected career and restart the test
            const selectedCard = document.querySelector('.career-card.selected');
            if (selectedCard) {
                showSkillsTest();
            }
        }

        function restartAssessment() {
            // Clear all stored data
            currentSection = 'intro';
            currentQuestion = 0;
            currentArea = '';
            assessmentData = null;
            userResponses = {};
            recommendations = null;
            skillQuestions = null;
            currentSkillQuestion = 0;
            skillScore = 0;
            
            // Clear the user description
            document.getElementById('user-description').value = '';
            
            // Show the intro section
            showSection('intro');
            updateProgress(0, 100);
        }

        function calculateTraitScores() {
            const traitScores = {};
            
            // Get all unique categories from all questions
            Object.values(assessmentData.areas).forEach(area => {
                area.questions.forEach(question => {
                    question.category.forEach(cat => {
                        if (!traitScores[cat]) {
                            traitScores[cat] = 0;
                        }
                    });
                });
            });
            
            // Calculate scores based on responses
            Object.entries(userResponses).forEach(([area, areaResponses]) => {
                areaResponses.forEach((response, questionIndex) => {
                    const questionData = assessmentData.areas[area].questions[questionIndex];
                    const selectedCategory = questionData.category[response.charCodeAt(0) - 65];
                    traitScores[selectedCategory]++;
                });
            });

            return traitScores;
        }
    </script>
</body>
</html>
